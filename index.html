<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>✨ Closet Craft — Your Closet, Beautifully Crafted</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti for Magical Visuals -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen bg-[#F3EFEA] flex flex-col items-center justify-center p-0 sm:p-4 selection:bg-pink-200">
  
  <!-- Desktop App Frame Switcher / Header Control -->
  <div class="hidden sm:flex items-center justify-between w-full max-w-md mb-3 px-2 text-xs font-semibold text-[#786C68]">
    <div class="flex items-center gap-2">
      <span class="text-base">✨</span>
      <span class="font-serif font-bold text-[#2D2522]">Closet Craft Mobile App Preview</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="global-frame-toggle" class="btn-press px-3 py-1.5 rounded-full bg-white border border-pink-200 text-pink-700 shadow-xs hover:bg-pink-50">
        📱 Toggle Phone Frame
      </button>
    </div>
  </div>

  <!-- Mobile Device Phone Shell -->
  <div class="phone-frame flex flex-col relative" id="phone-container">
    
    <!-- iPhone 15 Pro Dynamic Island & Status Bar -->
    <div class="w-full pt-3 px-6 pb-1 flex items-center justify-between z-30 select-none shrink-0 bg-[#FAF7F2]">
      <!-- Time -->
      <span class="text-xs font-bold text-[#2D2522] tracking-tight" id="status-clock">9:41</span>

      <!-- Dynamic Island Pill -->
      <div class="w-24 h-5 rounded-full bg-black flex items-center justify-between px-2.5 shadow-sm">
        <div class="w-2.5 h-2.5 rounded-full bg-pink-500/80 animate-pulse"></div>
        <span class="text-[9px] font-bold text-white tracking-widest uppercase">Crafty ✨</span>
        <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
      </div>

      <!-- Battery & Signal Icons -->
      <div class="flex items-center gap-1.5 text-xs text-[#2D2522]">
        <span class="text-[10px]">5G</span>
        <span>📶</span>
        <span>🔋</span>
      </div>
    </div>

    <!-- Active Screen Viewport -->
    <div id="app-screen" class="flex-1 w-full overflow-hidden relative">
      <!-- Injected by app.js router -->
    </div>

    <!-- Glassmorphic Bottom Navigation -->
    <div id="bottom-nav" class="absolute bottom-3 inset-x-0 px-4 z-30 pointer-events-auto">
      <!-- Injected by app.js -->
    </div>

    <!-- Modal Root for Drawers & Bottom Sheets -->
    <div id="modal-root" class="hidden relative z-50"></div>
  </div>

  <!-- Realtime Clock Updater -->
  <script>
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      const clockEl = document.getElementById('status-clock');
      if (clockEl) clockEl.textContent = `${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 30000);

    const frameToggleBtn = document.getElementById('global-frame-toggle');
    if (frameToggleBtn) {
      frameToggleBtn.addEventListener('click', () => {
        const frame = document.getElementById('phone-container');
        frame.classList.toggle('fullscreen-mode');
      });
    }
  </script>

  <!-- Main ES Module -->
  <script type="module" src="app.js"></script>
</body>
</html>
